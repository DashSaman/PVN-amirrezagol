name: M2 OpenVPN Adapter CI

on:
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/openvpn-adapter/**"
      - ".github/workflows/m2-openvpn-adapter-ci.yml"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/openvpn-adapter/**"
      - ".github/workflows/m2-openvpn-adapter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: OpenVPN adapter/import contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Test OpenVPN adapter slice
        run: gradle --no-daemon :engines:openvpn-adapter:jvmTest --stacktrace
