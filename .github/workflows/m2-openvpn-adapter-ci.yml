name: M2 OpenVPN Adapter CI

on:
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/openvpn-adapter/**"
      - "scripts/test-openvpn-real-link.sh"
      - ".github/workflows/m2-openvpn-adapter-ci.yml"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/openvpn-adapter/**"
      - "scripts/test-openvpn-real-link.sh"
      - ".github/workflows/m2-openvpn-adapter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: OpenVPN adapter/import contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Test OpenVPN adapter slice
        run: gradle --no-daemon :engines:openvpn-adapter:jvmTest --stacktrace

  real-link:
    name: OpenVPN real link / isolated Linux namespaces
    needs: adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install runner OpenVPN package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openvpn iproute2 iputils-ping openssl
      - name: Establish real OpenVPN tunnel and ping both directions
        run: sudo bash scripts/test-openvpn-real-link.sh

  product-runtime-real-peer:
    name: PVNetwork system runtime / real OpenVPN TLS peer
    needs: adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Install unbundled system OpenVPN runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openvpn openssl libcap2-bin
      - name: Exercise JvmSystemOpenVpnRuntimeFactory against real peer
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            set +e
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi
            ip link del tun23 >/dev/null 2>&1 || true
            ip link del tun24 >/dev/null 2>&1 || true
            rm -rf "$workdir"
          }
          trap cleanup EXIT INT TERM

          openvpn_bin="$(command -v openvpn)"
          sudo setcap cap_net_admin+ep "$openvpn_bin"
          getcap "$openvpn_bin"

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$workdir/ca.key" -out "$workdir/ca.crt" \
            -days 1 -sha256 -subj "/CN=PVNetwork Runtime CI CA" >/dev/null 2>&1

          openssl req -newkey rsa:2048 -nodes \
            -keyout "$workdir/server.key" -out "$workdir/server.csr" \
            -subj "/CN=pvnetwork-runtime-server" >/dev/null 2>&1
          cat >"$workdir/server.ext" <<'EOF'
          basicConstraints=CA:FALSE
          keyUsage=digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:pvnetwork-runtime-server
          EOF
          openssl x509 -req -in "$workdir/server.csr" \
            -CA "$workdir/ca.crt" -CAkey "$workdir/ca.key" -CAcreateserial \
            -out "$workdir/server.crt" -days 1 -sha256 \
            -extfile "$workdir/server.ext" >/dev/null 2>&1

          openssl req -newkey rsa:2048 -nodes \
            -keyout "$workdir/client.key" -out "$workdir/client.csr" \
            -subj "/CN=pvnetwork-runtime-client" >/dev/null 2>&1
          cat >"$workdir/client.ext" <<'EOF'
          basicConstraints=CA:FALSE
          keyUsage=digitalSignature,keyEncipherment
          extendedKeyUsage=clientAuth
          EOF
          openssl x509 -req -in "$workdir/client.csr" \
            -CA "$workdir/ca.crt" -CAkey "$workdir/ca.key" -CAcreateserial \
            -out "$workdir/client.crt" -days 1 -sha256 \
            -extfile "$workdir/client.ext" >/dev/null 2>&1
          chmod 600 "$workdir"/*.key

          cat >"$workdir/server.conf" <<EOF
          port 11941
          proto udp
          dev tun23
          topology subnet
          server 10.77.23.0 255.255.255.0
          ca $workdir/ca.crt
          cert $workdir/server.crt
          key $workdir/server.key
          dh none
          keepalive 2 10
          persist-key
          persist-tun
          verb 3
          EOF

          "$openvpn_bin" --config "$workdir/server.conf" --log "$workdir/server.log" &
          server_pid=$!
          for _ in $(seq 1 20); do
            if grep -q "Initialization Sequence Completed" "$workdir/server.log" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "real OpenVPN peer exited during startup" >&2
              cat "$workdir/server.log" >&2 || true
              exit 1
            fi
            sleep 0.5
          done
          grep -q "Initialization Sequence Completed" "$workdir/server.log" || {
            echo "real OpenVPN peer did not initialize" >&2
            cat "$workdir/server.log" >&2 || true
            exit 1
          }

          export PVNETWORK_OPENVPN_REAL_RUNTIME_TEST=1
          export PVNETWORK_OPENVPN_REAL_EXECUTABLE="$openvpn_bin"
          export PVNETWORK_OPENVPN_REAL_PORT=11941
          export PVNETWORK_OPENVPN_REAL_CA="$workdir/ca.crt"
          export PVNETWORK_OPENVPN_REAL_CLIENT_CERT="$workdir/client.crt"
          export PVNETWORK_OPENVPN_REAL_CLIENT_KEY="$workdir/client.key"
          export PVNETWORK_OPENVPN_REAL_CLIENT_DEVICE=tun24

          if ! gradle --no-daemon :engines:openvpn-adapter:jvmTest \
            --tests 'com.pvnetwork.engine.openvpn.JvmSystemOpenVpnRuntimeTest.realSystemOpenVpnRuntimePathReachesConnectedWhenCiFixtureEnabled' \
            --stacktrace; then
            echo "--- real OpenVPN peer log (CI-only fixture diagnostic) ---" >&2
            cat "$workdir/server.log" >&2 || true
            echo "--- tunnel interfaces after product-runtime failure ---" >&2
            ip -details addr show tun23 >&2 || true
            ip -details addr show tun24 >&2 || true
            exit 1
          fi
