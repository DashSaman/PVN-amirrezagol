name: M2-M3 Xray Adapter CI

on:
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/xray-adapter/**"
      - ".github/workflows/m2-xray-adapter-ci.yml"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/xray-adapter/**"
      - ".github/workflows/m2-xray-adapter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: Xray modern-protocol adapter/runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Test Xray adapter/runtime slice
        run: gradle --no-daemon :engines:xray-adapter:jvmTest --stacktrace

  real-xray-jvm:
    name: Real Xray modern-protocol JVM data paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"
      - name: Install exact-checksum CI-only Xray fixture
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Xray-linux-64.zip"
          root="$RUNNER_TEMP/pvnetwork-xray-ci-fixture"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$archive" \
            "https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip"
          echo "8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  $archive" | sha256sum -c -
          mkdir -p "$root"
          unzip -q "$archive" -d "$root"
          xray_bin="$(find "$root" -maxdepth 2 -type f -name xray -print -quit)"
          test -n "$xray_bin"
          chmod +x "$xray_bin"
          "$xray_bin" version
          echo "PVNETWORK_XRAY_TEST_EXECUTABLE=$xray_bin" >> "$GITHUB_ENV"
      - name: Create trusted CI-only Trojan TLS material
        shell: bash
        run: |
          set -euo pipefail
          tls="$RUNNER_TEMP/pvnetwork-xray-trojan-tls"
          mkdir -p "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls/ca.key" -out "$tls/ca.crt" -days 1 \
            -subj "/CN=PVNetwork M3 CI CA"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls/server.key" -out "$tls/server.csr" \
            -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > "$tls/server.ext"
          openssl x509 -req -in "$tls/server.csr" \
            -CA "$tls/ca.crt" -CAkey "$tls/ca.key" -CAcreateserial \
            -out "$tls/server.crt" -days 1 -sha256 -extfile "$tls/server.ext"
          sudo cp "$tls/ca.crt" /usr/local/share/ca-certificates/pvnetwork-m3-ci.crt
          sudo update-ca-certificates >/dev/null
          echo "PVNETWORK_XRAY_TEST_TLS_CERT=$tls/server.crt" >> "$GITHUB_ENV"
          echo "PVNETWORK_XRAY_TEST_TLS_KEY=$tls/server.key" >> "$GITHUB_ENV"
      - name: Prove real Xray protocol data paths through product runtime
        run: >-
          gradle --no-daemon :engines:xray-adapter:jvmTest
          --tests '*JvmHostXrayRealBinaryInteropTest'
          --stacktrace
