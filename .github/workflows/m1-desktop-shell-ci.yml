name: M1 Desktop Shell CI

on:
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "apps/desktop/**"
      - ".github/workflows/m1-desktop-shell-ci.yml"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "apps/desktop/**"
      - ".github/workflows/m1-desktop-shell-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-shell:
    name: Compose Desktop compile, test, distributable and launch smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Test and create desktop distributable
        run: gradle --no-daemon :apps:desktop:test :apps:desktop:createDistributable --stacktrace

      - name: Launch desktop shell under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          LOG="${RUNNER_TEMP}/pvnetwork-desktop-launch.log"
          PVNETWORK_UI_SMOKE=1 timeout 90s xvfb-run -a gradle --no-daemon :apps:desktop:run --stacktrace | tee "$LOG"
          grep -F "PVNetwork desktop launch smoke: PASS" "$LOG"
