name: Refresh Legacy Markdown Progress

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full recent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 120
      - name: Generate legacy fallback only
        run: python scripts/update_live_progress.py
      - name: Commit legacy fallback if requested manually
        run: |
          FILES=(LIVE_PROGRESS.md LIVE_PROGRESS_EN.md assets/live-progress-fa.svg assets/live-progress-en.svg)
          if git diff --quiet -- "${FILES[@]}"; then
            echo "PASS: legacy fallback already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "chore(progress): refresh legacy markdown fallback"
          git pull --rebase origin main
          git push origin HEAD:main
