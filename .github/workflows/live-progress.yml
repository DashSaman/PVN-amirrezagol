name: Refresh Live Progress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'LIVE_PROGRESS.md'
      - 'LIVE_PROGRESS_EN.md'
      - 'assets/live-progress-fa.svg'
      - 'assets/live-progress-en.svg'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: live-progress-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full recent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 120

      - name: Generate bilingual graphical dashboard
        run: python scripts/update_live_progress.py

      - name: Commit dashboard only when state changed
        run: |
          FILES=(LIVE_PROGRESS.md LIVE_PROGRESS_EN.md assets/live-progress-fa.svg assets/live-progress-en.svg)
          if git diff --quiet -- "${FILES[@]}" && [ -f LIVE_PROGRESS_EN.md ] && [ -f assets/live-progress-fa.svg ] && [ -f assets/live-progress-en.svg ]; then
            echo "PASS: bilingual dashboard already matches repository state"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "chore(progress): refresh bilingual live dashboard"

          git pull --rebase origin main
          git push origin HEAD:main
