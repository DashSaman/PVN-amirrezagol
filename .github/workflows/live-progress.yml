name: Refresh Live Progress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'LIVE_PROGRESS.md'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: live-progress-main
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full recent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Generate evidence-based dashboard
        run: python scripts/update_live_progress.py

      - name: Commit dashboard only when state changed
        run: |
          if git diff --quiet -- LIVE_PROGRESS.md; then
            echo "PASS: LIVE_PROGRESS.md already matches repository state"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_PROGRESS.md
          git commit -m "chore(progress): refresh live dashboard"

          # Main may move while research agents are committing. Rebase once;
          # if another push wins the race, the next push/scheduled run retries.
          git pull --rebase origin main
          git push origin HEAD:main
