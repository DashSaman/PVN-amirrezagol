name: M4 Public Apps CI

on:
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/xray-adapter/**"
      - "apps/desktop/**"
      - "apps/android/**"
      - ".github/workflows/m4-public-apps-ci.yml"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "engines/xray-adapter/**"
      - "apps/desktop/**"
      - "apps/android/**"
      - ".github/workflows/m4-public-apps-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop tests + distributable
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Run desktop tests
        run: gradle --no-daemon :apps:desktop:test --stacktrace

      - name: Build desktop distributable
        run: gradle --no-daemon :apps:desktop:packageDistributionForCurrentOS --stacktrace

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android platform 37 is installed
        run: |
          if [ ! -d "${ANDROID_HOME}/platforms/android-37.0" ]; then
            yes | sdkmanager "platforms;android-37.0" > /dev/null || yes | sdkmanager "platforms;android-37" > /dev/null
          fi

      - name: Assemble debug APK (fetches pinned Xray core, bundles hev tun2socks)
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g :apps:android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pvnetwork-android-debug-apk
          path: apps/android/build/outputs/apk/debug/android-debug.apk
          retention-days: 14
