name: M0 Foundation CI

on:
  push:
    branches: [main]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "tools/foundation-smoke/**"
      - "scripts/test-foundation.sh"
      - ".github/workflows/m0-foundation-ci.yml"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "core/**"
      - "tools/foundation-smoke/**"
      - "scripts/test-foundation.sh"
      - ".github/workflows/m0-foundation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Kotlin 2.4.10 / Gradle 9.5.0 / JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Run foundation JVM tests
        run: gradle --no-daemon :core:foundation:jvmTest --stacktrace

  foundation-mobile-targets:
    name: Kotlin 2.4.10 / Android + iOS target compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android platform 36 is installed
        run: |
          if [ ! -d "${ANDROID_HOME}/platforms/android-36" ]; then
            yes | sdkmanager "platforms;android-36" > /dev/null
          fi

      - name: Compile common metadata and Android target
        run: gradle --no-daemon :core:foundation:compileCommonMainKotlinMetadata :core:foundation:compileAndroidMain :core:foundation:bundleAndroidMainAar :core:foundation:testAndroidHostTest --stacktrace

      - name: Compile Apple targets (cross-compile from Linux)
        run: gradle --no-daemon :core:foundation:compileKotlinIosArm64 :core:foundation:compileKotlinIosSimulatorArm64 --stacktrace
